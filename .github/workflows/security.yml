name: security-scan

# runs the full pipeline on every PR and push to main.
# SARIF output is uploaded to github code scanning -> findings show up as
# inline PR annotations in code review.
# the gate fails on NEW findings only (baseline.json, written by the
# write-scan-baseline workflow); actions are pinned to commit SHAs so a
# mutable tag cannot silently change what runs in CI.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read        # least privilege: this workflow never pushes
  security-events: write # sarif upload

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: reports
      BASELINE_FILE: baseline.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history: gitleaks scans git history

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ github.sha }}
          restore-keys: trivy-${{ runner.os }}-

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.semgrep
          key: semgrep-${{ runner.os }}-${{ github.sha }}
          restore-keys: semgrep-${{ runner.os }}-

      - name: run pipeline
        id: scan
        continue-on-error: true # upload sarif even when the gate fails
        run: ./pipeline.sh "$GITHUB_WORKSPACE" --pm apt

      - name: upload sarif to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: reports/sarif # a directory: uploads every <tool>.sarif in it

      - name: upload unified reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: reports/unified/

      - name: gate
        if: always() && steps.scan.outcome == 'failure'
        run: |
          echo "pipeline gate: FAIL - new findings detected (see code scanning alerts and the security-reports artifact)"
          exit 1
